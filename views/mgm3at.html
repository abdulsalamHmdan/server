<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة الفروع — عرض ثابت</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f6f7f9;
      --paper: rgba(255,255,255,.86);
      --card: #ffffff;
      --ink: #0b1220;
      --sub: rgba(11,18,32,.62);
      --line: rgba(11,18,32,.10);
      --line2: rgba(11,18,32,.07);

      --shadow: 0 26px 72px rgba(16,24,40,.12);
      --shadow2: 0 14px 34px rgba(16,24,40,.10);

      --r-xl: 28px;
      --r-lg: 22px;
      --r-md: 16px;
      --r-sm: 12px;

      --accent: #2563eb;
      --accent2:#0f172a;

      --s1:#2563eb;
      --s2:#06b6d4;
      --s3:#10b981;
      --s4:#f59e0b;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 650px at 88% -10%, rgba(37,99,235,.10), transparent 58%),
        radial-gradient(850px 600px at 8% 0%, rgba(16,185,129,.08), transparent 55%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* Top bar */
    .top{
      position:sticky; top:0; z-index:50;
      padding: 12px 12px 10px;
      backdrop-filter: blur(12px);
      background: rgba(246,247,249,.72);
      border-bottom:1px solid var(--line2);
    }
    .topInner{
      max-width:1240px; margin:0 auto;
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
    .brand{display:flex; align-items:center; gap:10px}
    .mark{
      width:34px; height:34px; border-radius:12px;
      background: linear-gradient(180deg, #111827, #0b1220);
      box-shadow: 0 14px 30px rgba(17,24,39,.20);
      position:relative;
    }
    .mark:after{
      content:""; position:absolute; inset:8px; border-radius:8px;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.04));
    }
    .brand h1{margin:0; font-size:14px; font-weight:1000;}
    .brand p{margin:2px 0 0; font-size:12px; font-weight:900; color:var(--sub)}

    .seg{
      display:flex; gap:6px;
      padding:5px;
      border-radius:999px;
      border:1px solid var(--line2);
      background: rgba(255,255,255,.78);
      box-shadow: var(--shadow2);
    }
    .seg button{
      border:0; background:transparent;
      padding:10px 20px;
      border-radius:999px;
      font-weight:1000; font-size:13px;
      background:#fff;
      color: var(--ink);
      box-shadow: 0 10px 18px rgba(16,24,40,.10);
    }

    .actions{display:flex; gap:10px; flex-wrap:wrap}
    .btn{
      appearance:none; border:1px solid var(--line2);
      background: rgba(255,255,255,.84); color: var(--ink);
      padding: 10px 12px; border-radius: 14px;
      font-weight:1000; font-size:13px;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      box-shadow: 0 10px 20px rgba(16,24,40,.07);
    }
    .btn.primary{
      border-color: transparent;
      background: linear-gradient(180deg, var(--accent2), #0b1220);
      color:#fff;
      box-shadow: 0 16px 30px rgba(15,23,42,.24);
    }
    .btn.small{padding:8px 10px; border-radius:12px; font-size:12px; box-shadow:none}
    .btn.ghost{background:transparent; box-shadow:none}

    /* Layout */
    .wrap{max-width:1240px; margin:0 auto; padding: 12px 12px 26px}
    .layout{
      display:grid; grid-template-columns: 1.12fr .88fr; gap: 14px; align-items:start;
    }
    @media (max-width: 980px){ .layout{grid-template-columns:1fr} }

    /* Panels */
    .panel{
      background: var(--paper); border: 1px solid var(--line2);
      border-radius: var(--r-xl); box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      padding: 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
      border-bottom:1px solid var(--line2); background: rgba(255,255,255,.72);
    }

    /* Search & Chips */
    .searchRow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; flex:1;}
    .search{
      flex:1; min-width:240px; border:1px solid var(--line2);
      background:#fff; border-radius: 14px; padding: 10px 12px;
      outline:none; font-weight:900; font-size:13px;
    }
    .chip{
      display:inline-flex; align-items:center; gap:8px; padding:8px 10px;
      border-radius:999px; border:1px solid var(--line2);
      background: rgba(255,255,255,.84); font-size:12px; font-weight:1000;
    }

    .list{ padding: 12px; display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    @media (max-width: 760px){ .list{grid-template-columns:1fr} }

    /* Card */
    .card{
      background: linear-gradient(180deg, #fff, rgba(255,255,255,.92));
      border:1px solid rgba(11,18,32,.08); border-radius: 22px;
      box-shadow: 0 14px 30px rgba(16,24,40,.10); padding: 12px;
      position:relative; overflow:hidden;
    }
    .card.selected{ outline: 3px solid rgba(37,99,235,.18); border-color: rgba(37,99,235,.20); }
    .cardTop{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .name{ font-size: 18px; font-weight:1000; margin:0; }
    .kpi{ text-align:left; min-width: 140px; }
    .kpi .l{font-size:11px; font-weight:1000; color:rgba(11,18,32,.45)}
    .kpi .v{font-size:16px; font-weight:1000; margin-top:4px}
    .kpi .v strong{font-size:18px}
    .meta{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:7px 9px;
      border-radius:999px; border:1px solid rgba(11,18,32,.08);
      background: rgba(248,250,252,.75); font-size:11px; font-weight:1000;
    }
    .pill span{color: rgba(11,18,32,.45); font-weight:900}

    /* Progress bar */
    .barWrap{margin-top:8px}
    .bar{
      height: 14px; border-radius: 999px; overflow:hidden;
      border:1px solid rgba(11,18,32,.08); background: #f3f4f6; display:flex;
    }
    .segm{height:100%}
    .legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px}
    .leg{
      display:inline-flex; align-items:center; gap:8px; padding:6px 9px;
      border-radius:999px; border:1px solid rgba(11,18,32,.08);
      background: rgba(255,255,255,.78); font-size:11px; font-weight:1000; color: rgba(11,18,32,.72);
    }
    .dot{width:10px;height:10px;border-radius:999px;border:1px solid rgba(0,0,0,.12)}

    /* Inspector (Left Side) */
    .inspector{ position:sticky; top:84px; }
    @media (max-width: 980px){ .inspector{position:static} }
    .hero{
      padding: 16px; border-bottom:1px solid var(--line2);
      background: radial-gradient(700px 450px at 20% 0%, rgba(37,99,235,.14), transparent 62%), rgba(255,255,255,.72);
    }
    .hero h2{ margin:0; font-size: 22px; font-weight:1000; }
    .hero p{ margin:6px 0 0; color: var(--sub); font-size:12px; font-weight:900; }

    .big{ display:grid; grid-template-columns: 1fr; gap: 10px; padding: 12px; }
    .tile{ border:1px solid var(--line2); background: rgba(255,255,255,.86); border-radius: 18px; padding: 12px; }
    .tile .t{font-size:12px; font-weight:1000; color:var(--sub)}
    .tile .v{ margin-top:8px; font-size: 30px; font-weight:1000; color: var(--ink); }
    .tile .s{margin-top:8px; font-size:12px; font-weight:900; color:var(--sub);}

    .stageGrid{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; padding: 12px; }
    @media (max-width: 980px){ .stageGrid{grid-template-columns:1fr} }
    .stage{
      border:1px solid rgba(11,18,32,.08); background: rgba(255,255,255,.86);
      border-radius: 18px; padding: 12px; position:relative; overflow:hidden;
    }
    .stage:before{ content:""; position:absolute; inset:0 0 auto 0; height:6px; background: var(--stageColor, var(--s1)); }
    .stage .row{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:10px; }
    .stage .row b{font-size:12px; font-weight:1000}
    .stage .row span{font-size:11px; font-weight:900; color:var(--sub)}
    .stage .lbl{font-size:12px; font-weight:1000; color:var(--sub); margin-bottom:6px}
    .stage .amt{ font-size: 28px; font-weight:1000; color: var(--ink); }
    .stage .amt .cur{font-size:14px; font-weight:1000; color:rgba(11,18,32,.55); margin-right:6px}
  </style>
</head>
<body>

  <header class="top">
    <div class="topInner">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>لوحة الفروع</h1>
          <p>عرض مبسّط للمدراء • إدارة مركزية للمراحل والمحفظة</p>
        </div>
      </div>

      <div class="seg">
        <button class="active">عرض</button>
      </div>

      <div class="actions">
        <button class="btn primary">مثال جاهز</button>
        <button class="btn">طباعة / PDF</button>
        <button class="btn">تصدير صورة</button>
        <button class="btn">تصدير صور ZIP</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="layout">
      
      <div class="panel">
        <div class="panelHead">
          <div class="searchRow">
            <input class="search" placeholder="ابحث باسم المجمع..." disabled />
            <span class="chip">16 بطاقة</span>
          </div>
          <div class="actions">
            <button class="btn small">تركيز</button>
            <button class="btn small ghost">طريقة الإدخال</button>
          </div>
        </div>
        
        <div class="list">

          
        </div>
      </div>

    <div class="panel inspector">
      <div>
        <div class="hero">
        <h2>-</h2>
        <p>اختر مجمعاً لعرض التفاصيل</p>
        </div>

        <div class="big">
        <div class="tile">
          <div class="t">التكلفة الإجمالية</div>
          <div class="v">-</div>
          <div class="s">-</div>
        </div>

        <div class="tile">
          <div class="t">التغطية الحالية</div>
          <div class="v">-</div>
          <div class="s">-</div>
        </div>

        <div class="tile">
          <div class="t">هدف المحفظة الاستثمارية</div>
          <div class="v">-</div>
          <div class="s">-</div>
        </div>

        <div class="tile">
          <div class="t">الوضع الآن وخطة المراحل</div>
          <div class="barWrap">
            <div class="bar">
            </div>
            <div class="legend">
            </div>
          </div>
          <div class="s">-</div>
        </div>
        </div>

        <div style="padding:0 14px 14px">
        <b style="display:block; font-size:13px; font-weight:1000; margin:10px 2px 10px;">أهداف المراحل</b>
        <div class="stageGrid">
        </div>
        </div>
      </div>
    </div>

    </section>
  </main>
  <script>
  // === دوال مساعدة لتنسيق الأرقام ===
  const formatNum = (num) => Number(num).toLocaleString("ar-SA");
  const formatMoney = (num) => formatNum(num);


  function addCompoundCard(data) {
    const listContainer = document.querySelector('.list');
    
    // بناء الأشرطة الملونة للبطاقة
    let segmentsHtml = '';
    data.segments.forEach(seg => {
      segmentsHtml += `<div class="segm" style="width:${seg.width}%; background:${seg.color}"></div>`;
    });

    // إنشاء عنصر البطاقة
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.id = `card-${data.id}`;
    
    // عند الضغط على البطاقة، يتم تفعيلها وتمرير بياناتها للوحة الجانبية
    cardEl.onclick = function() {
      // إزالة التحديد من كل البطاقات الأخرى
      document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
      // إضافة التحديد للبطاقة الحالية
      cardEl.classList.add('selected');
      // استدعاء دالة عرض التفاصيل
      showCompoundDetails(data);
    };

    // محتوى البطاقة
    cardEl.innerHTML = `
      <div class="cardTop">
        <h3 class="name">${data.name}</h3>
        <div class="kpi">
          <div class="l">التكلفة</div>
          <div class="v"><strong>${formatMoney(data.cost)}</strong></div>
        </div>
      </div>
      <div class="meta">
        <span class="pill"><span>طلاب</span> ${formatNum(data.students)}</span>
        <span class="pill"><span>تغطية</span> ${data.coveragePct}%</span>
      </div>
      <div class="barWrap">
        <div class="bar">
          ${segmentsHtml}
        </div>
      </div>
    `;

    // إضافة البطاقة للقائمة
    listContainer.appendChild(cardEl);
  }




  function showCompoundDetails(data) {
    const inspector = document.querySelector('.inspector');
    inspector.scrollIntoView({ behavior: 'smooth' });

    document.querySelector(".hero p").textContent = `ملخص جاهز للعرض: التكلفة، التغطية، المحفظة، ثم المراحل.`;
    
    // 1. تحديث الترويسة (Hero)
    inspector.querySelector('.hero h2').textContent = data.name;

    // 2. تحديث المربعات الأربعة (Tiles)
    const tiles = inspector.querySelectorAll('.big .tile');
    
    // المربع الأول: التكلفة الإجمالية
    tiles[0].querySelector('.v').textContent = `${formatMoney(data.cost)} ريال`;
    tiles[0].querySelector('.s').textContent = `عدد الطلاب: ${formatNum(data.students)}`;

    // المربع الثاني: التغطية الحالية
    tiles[1].querySelector('.v').textContent = `${data.coveragePct}% • ${formatMoney(data.coveredAmount)} ريال`;
    tiles[1].querySelector('.s').textContent = `تغطية الجمعية الحالية من التكلفة الإجمالية.`;

    // المربع الثالث: المحفظة الاستثمارية
    tiles[2].querySelector('.v').textContent = `${formatMoney(data.portfolioGoal)} ريال`;
    tiles[2].querySelector('.s').textContent = data.goalNote;

    // المربع الرابع: خطة المراحل (الشريط ودليل الألوان)
    let bigBarHtml = '';
    data.segments.forEach(seg => {
      bigBarHtml += `<div class="segm" style="width: ${seg.width}%; background: ${seg.color};"></div>`;
    });
    tiles[3].querySelector('.bar').innerHTML = bigBarHtml;

    let legendHtml = '';
    data.legend.forEach(leg => {
      legendHtml += `<span class="leg"><span class="dot" style="background:${leg.color}"></span>${leg.text}</span>`;
    });
    tiles[3].querySelector('.legend').innerHTML = legendHtml;
    tiles[3].querySelector('.s').textContent = data.afterPlanNote;

    // 3. تحديث أهداف المراحل أسفل الشاشة
    const stageGrid = inspector.querySelector('.stageGrid');
    stageGrid.innerHTML = ''; // تفريغ المراحل القديمة
    
    data.stages.forEach(stage => {
      const stageEl = document.createElement('div');
      stageEl.className = 'stage';
      stageEl.style.setProperty('--stageColor', stage.color);
      stageEl.innerHTML = `
        <div class="row">
          <b>${stage.name}</b>
          <span>${stage.period}</span>
        </div>
        <div class="lbl">هدف المرحلة</div>
        <div class="amt">${formatMoney(stage.goal)}<span class="cur">﷼</span></div>
      `;
      stageGrid.appendChild(stageEl);
    });
  }

  
  const sampleData = {
    id: 99,
    name: "مجمع خالد بن الوليد",
    cost: 350000,
    students: 210,
    coveragePct: 25,
    coveredAmount: 87500,
    portfolioGoal: 1200000,
    goalNote: "لتغطية المتبقي بعد التغطية الحالية على عائد سنوي 8% (مبلغ التغطية المطلوب: 96,000 ريال).",
    afterPlanNote: "بعد خطة المراحل: تصل التغطية إلى 100%.",
    segments: [
      { width: 25, color: "rgba(247,168,163,1)" },
      { width: 35, color: "var(--s1)" },
      { width: 40, color: "var(--s2)" }
    ],
    legend: [
      { color: "rgba(247,168,163,1)", text: "الحالي: 87,500 ريال" },
      { color: "#111827", text: "المراحل: 262,500 ريال" },
      { color: "#e5e7eb", text: "المتبقي: 0 ريال" }
    ],
    stages: [
      { name: "المرحلة الأولى", period: "رمضان القادم", goal: 122500, color: "var(--s1)" },
      { name: "المرحلة الثانية", period: "نهاية العام", goal: 140000, color: "var(--s2)" }
    ]
  };
  const aa = {
    id: 99,
    name: "مجمع خالد بن الوليد",
    cost: 350000,
    students: 210,
    portfolioGoal: 1200000,
    FinReturn: "لتغطية المتبقي بعد التغطية الحالية على عائد سنوي 8% (مبلغ التغطية المطلوب: 96,000 ريال).",
    segments: [
      { width: 25, color: "rgba(247,168,163,1)" },
      { width: 35, color: "var(--s1)" },
      { width: 40, color: "var(--s2)" }
    ],
    legend: [
      { color: "rgba(247,168,163,1)", text: "الحالي: 87,500 ريال" },
      { color: "#111827", text: "المراحل: 262,500 ريال" },
      { color: "#e5e7eb", text: "المتبقي: 0 ريال" }
    ],
    stages: [
      { name: "المرحلة الأولى", period: "رمضان القادم", goal: 122500, color: "var(--s1)" },
      { name: "المرحلة الثانية", period: "نهاية العام", goal: 140000, color: "var(--s2)" }
    ]
  };

  // ستلاحظ أن البطاقة تمت إضافتها أسفل القائمة، وعند الضغط عليها ستتحدث اللوحة الجانبية فوراً.
  addCompoundCard(sampleData);

</script>

</body>
</html>
